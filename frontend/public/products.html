<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce Sales Analytics System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: #f0f4ff; }
    .sidebar-scrollbar::-webkit-scrollbar { width: 4px; }
    .sidebar-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .nav-item { transition: all 0.2s ease; }
    .nav-item:hover { transform: translateX(3px); }
    .card-hover { transition: box-shadow 0.25s ease, transform 0.25s ease; }
    .card-hover:hover { box-shadow: 0 8px 30px rgba(37,99,235,0.12); transform: translateY(-2px); }
    .fade-in { animation: fadeIn 0.35s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .bar { transition: height 0.6s cubic-bezier(.4,0,.2,1); }
    .progress-bar { transition: width 1s cubic-bezier(.4,0,.2,1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Icons (inline SVG components) ──────────────────────────────────────────
    const Icon = ({ d, size = 20, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round"
        strokeLinejoin="round" className={className}>
        {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
      </svg>
    );

    const icons = {
      dashboard:   "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
      customers:   ["M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2", "M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z", "M23 21v-2a4 4 0 0 0-3-3.87", "M16 3.13a4 4 0 0 1 0 7.75"],
      products:    ["M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z", "M3 6h18", "M16 10a4 4 0 0 1-8 0"],
      categories:  ["M4 6h16M4 12h16M4 18h7"],
      orders:      ["M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2", "M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2", "M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"],
      payments:    ["M21 4H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z", "M1 10h22"],
      search:      ["M11 17a6 6 0 1 0 0-12 6 6 0 0 0 0 12z", "M21 21l-4.35-4.35"],
      bell:        ["M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9", "M13.73 21a2 2 0 0 1-3.46 0"],
      chevron:     "M9 18l6-6-6-6",
      trend:       ["M22 12h-4l-3 9L9 3l-3 9H2"],
      dollar:      ["M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"],
      cart:        ["M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z", "M3 6h18"],

      arrowDown:   "M12 5v14M19 12l-7 7-7-7",
      menu:        "M3 12h18M3 6h18M3 18h18",
      x:           "M18 6L6 18M6 6l12 12",
    };

    // ── Sidebar Nav Items ──────────────────────────────────────────────────────
    const NAV = [
      { id: "dashboard",  label: "Dashboard",  icon: "dashboard"  },
      { id: "customers",  label: "Customers",  icon: "customers"  },
      { id: "products",   label: "Products",   icon: "products"   },
      { id: "categories", label: "Categories", icon: "categories" },
      { id: "orders",     label: "Orders",     icon: "orders"     },
      { id: "payments",   label: "Payments",   icon: "payments"   },
    ];

    // ── Stat Card ──────────────────────────────────────────────────────────────
    const StatCard = ({ label, value, sub, icon, color, trend }) => {
      const colors = {
        blue:   { bg: "bg-blue-50",   icon: "bg-blue-600",   text: "text-blue-600"   },
        indigo: { bg: "bg-indigo-50", icon: "bg-indigo-600", text: "text-indigo-600" },
        violet: { bg: "bg-violet-50", icon: "bg-violet-600", text: "text-violet-600" },
        emerald:{ bg: "bg-emerald-50",icon: "bg-emerald-600",text: "text-emerald-600"},
      };
      const c = colors[color] || colors.blue;
      return (
        <div className={`bg-white rounded-2xl p-5 shadow-sm card-hover ${c.bg} bg-opacity-30 border border-white`}>
          <div className="flex items-start justify-between mb-4">
            <div className={`w-11 h-11 rounded-xl ${c.icon} flex items-center justify-center shadow-md`}>
              <Icon d={icons[icon]} size={18} className="text-white" />
            </div>
            <span className={`text-xs font-600 px-2 py-1 rounded-full flex items-center gap-1 ${trend > 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600'}`}>
              <Icon d={trend > 0 ? icons.arrowUp : icons.arrowDown} size={11} />
              {Math.abs(trend)}%
            </span>
          </div>
          <p className="text-2xl font-700 text-gray-800 mb-1">{value}</p>
          <p className="text-sm text-gray-500 font-500">{label}</p>
          <p className="text-xs text-gray-400 mt-1">{sub}</p>
        </div>
      );
    };

    // ── Mini Bar Chart ─────────────────────────────────────────────────────────
    const BarChart = ({ data, color = "#2563eb" }) => {
      const max = Math.max(...data);
      return (
        <div className="flex items-end gap-1 h-16">
          {data.map((v, i) => (
            <div key={i} className="flex-1 rounded-t-sm bar"
              style={{ height: `${(v / max) * 100}%`, background: color, opacity: i === data.length - 1 ? 1 : 0.4 }} />
          ))}
        </div>
      );
    };

    // ── Progress Bar ───────────────────────────────────────────────────────────
    const ProgressBar = ({ pct, color = "bg-blue-600" }) => (
      <div className="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
        <div className={`h-full rounded-full progress-bar ${color}`} style={{ width: `${pct}%` }} />
      </div>
    );


    // ── Avatar ─────────────────────────────────────────────────────────────────
    const Avatar = ({ name = "Admin", size = 36 }) => {
      const initials = name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
      return (
        <div className="flex items-center justify-center rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white font-600 cursor-pointer select-none shadow-md"
          style={{ width: size, height: size, fontSize: size * 0.38 }}>
          {initials}
        </div>
      );
    };

    // ── Dashboard Page ─────────────────────────────────────────────────────────
   const Dashboard = () => {
    const months=[
"Jan","Feb","Mar","Apr","May","Jun",
"Jul","Aug","Sep","Oct","Nov","Dec"
];

const [customers,setCustomers]=useState([]);
const [products,setProducts]=useState([]);
const [orders,setOrders]=useState([]);
const [payments,setPayments]=useState([]);

useEffect(()=>{

axios.get("http://localhost:5000/customers")
.then(res=>setCustomers(res.data))
.catch(err=>console.log(err));

axios.get("http://localhost:5000/products")
.then(res=>setProducts(res.data))
.catch(err=>console.log(err));

axios.get("http://localhost:5000/orders")
.then(res=>setOrders(res.data))
.catch(err=>console.log(err));

axios.get("http://localhost:5000/payments")
.then(res=>setPayments(res.data))
.catch(err=>console.log(err));

},[]);

const totalCustomers=customers.length;
const totalProducts=products.length;
const totalOrders=orders.length;

const totalRevenue=payments.reduce(
(sum,p)=>sum+Number(p.amount),0
);

const revenueText=
totalRevenue>=100000
?"₹"+(totalRevenue/100000).toFixed(2)+"L"
:"₹"+totalRevenue.toLocaleString();

const categoryCount=
new Set(products.map(p=>p.category_id)).size;

const topProducts={};

orders.forEach(o=>{
topProducts[o.product_id]=(topProducts[o.product_id]||0)+o.quantity;
});

const topProductList=Object.entries(topProducts)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

const topProductsDisplay = topProductList.map(item => {

const prod = products.find(
p => p.product_id == item[0]
);

return {

name: prod ? prod.product_name : "Unknown Product",

sales: item[1],

pct: Math.min(item[1] * 20,100),

color: "bg-blue-600"

};

});
const chartData = Array(12).fill(0);

payments.forEach(p => {
    const month = new Date(p.payment_date).getMonth(); // Jan=0
    chartData[month] += Number(p.amount);
});
const recentOrders = orders
.slice()
.reverse()
.slice(0,6)
.map(o=>({

id:"ORD-"+String(o.order_id).padStart(4,"0"),

customer:"CUS-"+String(o.customer_id).padStart(4,"0"),

product:"PROD-"+String(o.product_id).padStart(4,"0"),

amount:"Qty : "+o.quantity,

status:"Completed",

date:new Date(o.order_date).toLocaleDateString()

}));
const statusStyles = {
  Completed: "bg-emerald-100 text-emerald-700",
  Pending: "bg-amber-100 text-amber-700",
  Processing: "bg-violet-100 text-violet-700",
  Delivered: "bg-emerald-100 text-emerald-700",
  Shipped: "bg-blue-100 text-blue-700",
  Cancelled: "bg-red-100 text-red-700",
};
      return (
        <div className="fade-in space-y-6">
          {/* Header */}
          <div>
            <h1 className="text-xl font-700 text-gray-800">Dashboard Overview</h1>
            <p className="text-sm text-gray-500 mt-0.5">Welcome back, Admin · Updated just now</p>
          </div>

          {/* Stat cards */}
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
            <StatCard
label="Total Revenue"
value={revenueText}
sub="From Payments"
icon="dollar"
color="blue"
trend={10}
/>

<StatCard
label="Total Orders"
value={totalOrders}
sub="Database Records"
icon="cart"
color="indigo"
trend={8}
/>

<StatCard
label="Customers"
value={totalCustomers}
sub="Registered"
icon="customers"
color="violet"
trend={5}
/>

<StatCard
label="Products"
value={totalProducts}
sub="Available"
icon="package"
color="emerald"
trend={3}
/>
          </div>

          {/* Chart + Top Products */}
          <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
            {/* Revenue Chart */}
            <div className="xl:col-span-2 bg-white rounded-2xl p-5 shadow-sm border border-gray-50">
              <div className="flex items-center justify-between mb-5">
                <div>
                  <h2 className="text-sm font-600 text-gray-800">Revenue Trend</h2>
                  <p className="text-xs text-gray-400 mt-0.5">Monthly performance · 2026–27</p>
                </div>
                <span className="text-xs bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-500">+18.4% YoY</span>
              </div>
              <div className="flex items-end gap-1.5 h-36 mt-2">
                {chartData.map((v, i) => {
                  const max = Math.max(...chartData,1);
                  //const months = ["Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun"];
                  const isLast = i === chartData.length - 1;
                  return (
                    <div key={i} className="flex-1 flex flex-col items-center gap-1">
                      <div className="w-full rounded-t-md bar"
                        style={{
                          height: `${(v / max) * 130}px`,
                          background: isLast ? "linear-gradient(180deg,#2563eb,#818cf8)" : "#dbeafe",
                          transition: `height ${0.3 + i * 0.05}s ease`
                        }} />
                      <span className="text-[9px] text-gray-400">{months[i]}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Top Products */}
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-50">
              <h2 className="text-sm font-600 text-gray-800 mb-1">Top Products</h2>
              <p className="text-xs text-gray-400 mb-4">By units sold this month</p>
              <div className="space-y-4">
                {topProductsDisplay.map((p, i) => (
                  <div key={i}>
                    <div className="flex justify-between mb-1.5">
                      <span className="text-xs text-gray-700 font-500 truncate max-w-[140px]">{p.name}</span>
                      <span className="text-xs text-gray-500 shrink-0">{p.sales} sold</span>
                    </div>
                    <ProgressBar pct={p.pct} color={p.color} />
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Orders Table */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-50 overflow-hidden">
            <div className="flex items-center justify-between px-5 py-4 border-b border-gray-50">
              <div>
                <h2 className="text-sm font-600 text-gray-800">Recent Orders</h2>
                <p className="text-xs text-gray-400 mt-0.5">Last 6 transactions</p>
              </div>
              <button className="text-xs text-blue-600 font-500 hover:text-blue-700 transition-colors">View all →</button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50 text-left">
                    {["Order ID", "Customer", "Product", "Amount", "Status", "Date"].map(h => (
                      <th key={h} className="px-5 py-3 text-xs font-600 text-gray-500 uppercase tracking-wide">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {recentOrders.map((o, i) => (
                    <tr key={i} className="border-t border-gray-50 hover:bg-blue-50/40 transition-colors cursor-pointer">
                      <td className="px-5 py-3.5 text-xs font-600 text-blue-600">{o.id}</td>
                      <td className="px-5 py-3.5">
                        <div className="flex items-center gap-2">
                          <Avatar name={o.customer} size={28} />
                          <span className="text-xs text-gray-700 font-500">{o.customer}</span>
                        </div>
                      </td>
                      <td className="px-5 py-3.5 text-xs text-gray-600 max-w-[160px] truncate">{o.product}</td>
                      <td className="px-5 py-3.5 text-xs font-600 text-gray-800">{o.amount}</td>
                      <td className="px-5 py-3.5">
                        <span className={`text-xs px-2.5 py-1 rounded-full font-500 ${statusStyles[o.status]}`}>{o.status}</span>
                      </td>
                      <td className="px-5 py-3.5 text-xs text-gray-400">{o.date}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // ── Customers Management Page ──────────────────────────────────────────────

    const INIT_CUSTOMERS = [
      { id: "CUS-0001", firstName: "Meera",    lastName: "Iyer",      email: "meera.iyer@gmail.com",      phone: "+91 98401 12345", city: "Chennai",   country: "India",          regDate: "12 Jan 2024", status: "Active"   },
      { id: "CUS-0002", firstName: "Arjun",    lastName: "Sharma",    email: "arjun.sharma@outlook.com",  phone: "+91 97302 67890", city: "Mumbai",    country: "India",          regDate: "03 Mar 2024", status: "Active"   },
      { id: "CUS-0003", firstName: "Priya",    lastName: "Nair",      email: "priya.nair@yahoo.com",      phone: "+91 80123 44556", city: "Bengaluru", country: "India",          regDate: "19 Feb 2024", status: "Inactive" },
      { id: "CUS-0004", firstName: "Rahul",    lastName: "Verma",     email: "rahul.verma@icloud.com",    phone: "+91 99001 23456", city: "Delhi",     country: "India",          regDate: "08 Oct 2023", status: "Active"   },
      { id: "CUS-0005", firstName: "Kavitha",  lastName: "Reddy",     email: "kavitha.reddy@gmail.com",   phone: "+91 76543 98765", city: "Hyderabad", country: "India",          regDate: "22 Apr 2024", status: "Active"   },
      { id: "CUS-0006", firstName: "Suresh",   lastName: "Pillai",    email: "suresh.pillai@hotmail.com", phone: "+91 94400 11223", city: "Kochi",     country: "India",          regDate: "15 May 2024", status: "Suspended"},
      { id: "CUS-0007", firstName: "Ananya",   lastName: "Ghosh",     email: "ananya.ghosh@gmail.com",    phone: "+91 81290 55678", city: "Kolkata",   country: "India",          regDate: "30 Nov 2023", status: "Active"   },
      { id: "CUS-0008", firstName: "Vikram",   lastName: "Singh",     email: "vikram.singh@proton.me",    phone: "+91 70011 99887", city: "Pune",      country: "India",          regDate: "05 Jan 2024", status: "Active"   },
      { id: "CUS-0009", firstName: "Lakshmi",  lastName: "Krishnan",  email: "lakshmi.k@gmail.com",       phone: "+91 93345 77654", city: "Coimbatore","country": "India",        regDate: "17 Jun 2024", status: "Inactive" },
      { id: "CUS-0010", firstName: "Mohammed", lastName: "Farouk",    email: "m.farouk@outlook.com",      phone: "+91 88765 43210", city: "Hyderabad", country: "India",          regDate: "09 Jun 2024", status: "Active"   },
    ];

    const statusBadge = s => ({
      Active:    "bg-emerald-100 text-emerald-700",
      Inactive:  "bg-gray-100 text-gray-500",
      Suspended: "bg-red-100 text-red-600",
    }[s] || "bg-gray-100 text-gray-500");

    // ── Add Customer Modal ─────────────────────────────────────────────────────
    const EMPTY_FORM = { firstName:"", lastName:"", email:"", phone:"", city:"", country:"" };

    const AddCustomerModal = ({ onClose, onSave }) => {
      const [form, setForm] = useState(EMPTY_FORM);
      const [errors, setErrors] = useState({});

      const field = (key, label, type = "text", placeholder = "") => {
        const hasErr = !!errors[key];
        return (
          <div>
            <label className="block text-xs font-600 text-gray-600 mb-1.5">{label}</label>
            <input
              type={type}
              value={form[key]}
              placeholder={placeholder}
              onChange={e => { setForm(f => ({...f, [key]: e.target.value})); setErrors(er => ({...er, [key]: ""})); }}
              className={`w-full px-3.5 py-2.5 text-xs rounded-xl border transition-all outline-none
                focus:ring-2 focus:ring-blue-200 focus:border-blue-400
                ${hasErr ? "border-red-300 bg-red-50" : "border-gray-200 bg-gray-50 hover:border-blue-300"}`}
            />
            {hasErr && <p className="text-[10px] text-red-500 mt-1">{errors[key]}</p>}
          </div>
        );
      };

      const validate = () => {
        const e = {};
        if (!form.firstName.trim()) e.firstName = "First name is required";
        if (!form.lastName.trim())  e.lastName  = "Last name is required";
        if (!form.email.trim() || !/\S+@\S+\.\S+/.test(form.email)) e.email = "Valid email is required";
        if (!form.phone.trim())     e.phone     = "Phone is required";
        if (!form.city.trim())      e.city      = "City is required";
        if (!form.country.trim())   e.country   = "Country is required";
        return e;
      };

      const handleSave = () => {
        const e = validate();
        if (Object.keys(e).length) { setErrors(e); return; }
        onSave(form);
      };

      // Trap scroll on mount 
      /*React.useEffect(() => {
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, []);*/

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:"rgba(15,23,42,0.45)", backdropFilter:"blur(4px)"}}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg fade-in overflow-hidden">
            {/* Modal Header */}
            <div className="flex items-center justify-between px-6 py-5 border-b border-gray-100">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-md">
                  <Icon d={icons.customers} size={16} className="text-white" />
                </div>
                <div>
                  <h2 className="text-sm font-700 text-gray-800">Add New Customer</h2>
                  <p className="text-[10px] text-gray-400 mt-0.5">Fill in the details below</p>
                </div>
              </div>
              <button onClick={onClose}
                className="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors">
                <Icon d={icons.x} size={16} />
              </button>
            </div>

            {/* Modal Body */}
            <div className="px-6 py-5 space-y-4">
              <div className="grid grid-cols-2 gap-4">
                {field("firstName", "First Name",  "text", "e.g. Meera")}
                {field("lastName",  "Last Name",   "text", "e.g. Iyer")}
              </div>

        Order
      </label>

      <select
        value={form.orderId}
        onChange={e => set("orderId", e.target.value)}
        className="w-full px-3 py-2.5 text-xs border border-gray-200 rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-200"
      >
        <option value="">Select Order</option>

        {orders.map(order => (
          <option
            key={order.order_id}
            value={order.order_id}
          >
            ORD-{String(order.order_id).padStart(4, "0")}
          </option>
        ))}
      </select>
    </div>

    <Field
      k="method"
      label="Payment Method"
      options={METHODS}
    />

  </div>

  <div className="grid grid-cols-2 gap-4">

    <Field
      k="status"
      label="Status"
      options={STATUSES}
    />

  </div>

</div>

            {/* Footer */}
            <div className="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-3">
              <button onClick={onClose}
                className="px-4 py-2.5 text-xs font-600 text-gray-600 bg-white border border-gray-200 rounded-xl hover:bg-gray-100 transition-colors">
                Cancel
              </button>
              <button onClick={handleSave}
                className="px-5 py-2.5 text-xs font-600 text-white bg-blue-600 rounded-xl hover:bg-blue-700 active:scale-95 transition-all shadow-sm flex items-center gap-2">
                <Icon d={icons.check} size={13} className="text-white" />
                Save Payment
              </button>
            </div>
          </div>
        </div>
      );
    };

    const Payments = () => {
      const [payments, setPayments] = useState([]);
      const [search, setSearch]     = useState("");
      const [method, setMethod]     = useState("All");
      const [showModal, setShowModal] = useState(false);
      const [methodOpen, setMethodOpen] = useState(false);

      useEffect(() => {
    axios.get("http://localhost:5000/payments")
        .then(res => {
            setPayments(
    res.data.map(p => ({
        id: "PAY-" + String(p.payment_id).padStart(4, "0"),
        orderId: "ORD-" + String(p.order_id).padStart(4, "0"),
        customer: "Customer " + p.order_id,
        amount: "₹" + Number(p.amount).toLocaleString("en-IN"),
        method: p.payment_method,
        status: p.payment_status,
        date: p.payment_date ? new Date(p.payment_date).toLocaleDateString("en-GB"): "-"
    }))
);
        })
        .catch(err => console.log(err));
}, []);

      const METHODS = ["All", "UPI", "Credit Card", "Debit Card", "Net Banking", "EMI"];

      const filtered = payments.filter(p => {
        const q = search.toLowerCase();
        const matchSearch = !q ||
          p.id.toLowerCase().includes(q) ||
          p.orderId.toLowerCase().includes(q) ||
          p.customer.toLowerCase().includes(q) ||
          p.method.toLowerCase().includes(q) ||
          p.status.toLowerCase().includes(q);
        const matchMethod = method === "All" || p.method === method;
        return matchSearch && matchMethod;
      });

      const totalRevenue   = payments.filter(p => p.status === "Completed")
        .reduce((s, p) => s + parseInt(p.amount.replace(/[₹,]/g, "")), 0);
      const completedCount = payments.filter(p => p.status === "Completed").length;
      const pendingCount   = payments.filter(p => p.status === "Pending").length;
      const failedCount    = payments.filter(p => p.status === "Failed").length;

      const fmt = n => n >= 100000
        ? "₹" + (n / 100000).toFixed(1) + "L"
        : "₹" + n.toLocaleString("en-IN");

      const handleAdd = (form) => {

    console.log("Payment form data:", form);

    const payload = {
        order_id: Number(String(form.orderId).replace("ORD-", "")),
        payment_method: form.method,
        payment_status: form.status,
        payment_date: new Date().toISOString().split("T")[0]
    };

    console.log("Payment payload:", payload);

    axios.post("http://localhost:5000/payments", payload)

        .then(() => axios.get("http://localhost:5000/payments"))

        .then((res) => {

            setPayments(
                res.data.map(p => ({
                    id: "PAY-" + String(p.payment_id).padStart(4, "0"),
                    orderId: "ORD-" + String(p.order_id).padStart(4, "0"),
                    customer: "Customer " + p.order_id,
                    amount: "₹" + Number(p.amount).toLocaleString("en-IN"),
                    method: p.payment_method,
                    status: p.payment_status,
                    date: new Date(p.payment_date).toLocaleDateString("en-GB")
                }))
            );

            setShowModal(false);

        })

        .catch(err => {
            console.log("Payment error:", err.response?.data || err.message);
            alert("Payment Insert Failed");
        });
};

      return (
        <div className="fade-in space-y-6">

          {/* ── Page Header ── */}
          <div className="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h1 className="text-xl font-700 text-gray-800">Payments Management</h1>
              <p className="text-sm text-gray-500 mt-0.5">Track transactions, payment methods, and revenue.</p>
            </div>
            <button onClick={() => setShowModal(true)}
              className="flex items-center gap-2 bg-blue-600 text-white text-xs font-600 px-4 py-2.5 rounded-xl hover:bg-blue-700 active:scale-95 transition-all shadow-sm shrink-0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
              Add Payment
            </button>
          </div>

          {/* ── Stat Cards ── */}
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">

            {/* Total Revenue */}
            <div className="bg-white rounded-2xl p-5 shadow-sm card-hover border border-white bg-blue-50/30">
              <div className="flex items-start justify-between mb-4">
                <div className="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center shadow-md">
                  <Icon d={icons.dollar} size={18} className="text-white" />
                </div>
                <span className="text-xs font-600 px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1">
                  <Icon d={icons.arrowUp} size={11} />14.2%
                </span>
              </div>
              <p className="text-2xl font-700 text-gray-800 mb-1">{fmt(totalRevenue)}</p>
              <p className="text-sm text-gray-500 font-500">Total Revenue</p>
              <p className="text-xs text-gray-400 mt-1">From completed payments</p>
            </div>

            {/* Completed */}
            <div className="bg-white rounded-2xl p-5 shadow-sm card-hover border border-white bg-emerald-50/30">
              <div className="flex items-start justify-between mb-4">
                <div className="w-11 h-11 rounded-xl bg-emerald-600 flex items-center justify-center shadow-md">
                  <Icon d={icons.check} size={18} className="text-white" />
                </div>
                <span className="text-xs font-600 px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1">
                  <Icon d={icons.arrowUp} size={11} />8.6%
                </span>
              </div>
              <p className="text-2xl font-700 text-gray-800 mb-1">{completedCount}</p>
              <p className="text-sm text-gray-500 font-500">Completed Payments</p>
              <p className="text-xs text-gray-400 mt-1">Successfully processed</p>
            </div>

            {/* Pending */}
            <div className="bg-white rounded-2xl p-5 shadow-sm card-hover border border-white bg-amber-50/30">
              <div className="flex items-start justify-between mb-4">
                <div className="w-11 h-11 rounded-xl bg-amber-500 flex items-center justify-center shadow-md">
                  <Icon d={icons.clock} size={18} className="text-white" />
                </div>
                <span className="text-xs font-600 px-2 py-1 rounded-full bg-red-100 text-red-600 flex items-center gap-1">
                  <Icon d={icons.arrowDown} size={11} />3.1%
                </span>
              </div>
              <p className="text-2xl font-700 text-gray-800 mb-1">{pendingCount}</p>
              <p className="text-sm text-gray-500 font-500">Pending Payments</p>
              <p className="text-xs text-gray-400 mt-1">Awaiting confirmation</p>
            </div>

            {/* Failed */}
            <div className="bg-white rounded-2xl p-5 shadow-sm card-hover border border-white bg-red-50/30">
              <div className="flex items-start justify-between mb-4">
                <div className="w-11 h-11 rounded-xl bg-red-500 flex items-center justify-center shadow-md">
                  <Icon d={icons.x} size={18} className="text-white" />
                </div>
                <span className="text-xs font-600 px-2 py-1 rounded-full bg-red-100 text-red-600 flex items-center gap-1">
                  <Icon d={icons.arrowDown} size={11} />5.4%
                </span>
              </div>
              <p className="text-2xl font-700 text-gray-800 mb-1">{failedCount}</p>
              <p className="text-sm text-gray-500 font-500">Failed Payments</p>
              <p className="text-xs text-gray-400 mt-1">Requires attention</p>
            </div>
          </div>

          {/* ── Table Card ── */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-50 overflow-hidden">

            {/* Toolbar */}
            <div className="flex items-center gap-3 px-5 py-4 border-b border-gray-50 flex-wrap gap-y-3">

              {/* Search */}
              <div className="relative flex-1 min-w-[200px]">
                <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                  <Icon d={icons.search} size={14} className="text-gray-400" />
                </div>
                <input
                  type="text"
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  placeholder="Search by ID, customer, method…"
                  className="w-full pl-9 pr-4 py-2 text-xs bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300 transition-all"
                />
              </div>

              {/* Method Filter */}
              <div className="relative">
                <button onClick={() => setMethodOpen(o => !o)}
                  className="flex items-center gap-2 px-3.5 py-2 text-xs font-500 text-gray-600 bg-gray-50 border border-gray-100 rounded-xl hover:border-blue-300 hover:bg-blue-50 transition-all whitespace-nowrap">
                  <Icon d={icons.payments} size={13} className="text-gray-400" />
                  {method === "All" ? "All Methods" : method}
                  <Icon d={icons.chevron} size={12} className={`text-gray-400 transition-transform ${methodOpen ? "rotate-90" : ""}`} />
                </button>
                {methodOpen && (
                  <div className="absolute right-0 top-10 bg-white rounded-xl shadow-xl border border-gray-100 z-20 overflow-hidden fade-in min-w-[150px]">
                    {METHODS.map(m => (
                      <button key={m}
                        onClick={() => { setMethod(m); setMethodOpen(false); }}
                        className={`w-full text-left px-4 py-2.5 text-xs font-500 transition-colors hover:bg-blue-50
                          ${method === m ? "text-blue-600 bg-blue-50/60 font-600" : "text-gray-600"}`}>
                        {m}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* Table */}
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50 text-left">
                    {["Payment ID", "Order ID", "Customer", "Amount", "Method", "Status", "Payment Date"].map(h => (
                      <th key={h} className="px-5 py-3 text-xs font-600 text-gray-500 uppercase tracking-wide whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="px-5 py-12 text-center text-xs text-gray-400">
                        No payments match your search.
                      </td>
                    </tr>
                  ) : filtered.map((p, i) => (
                    <tr key={p.id}
                      className={`border-t border-gray-50 hover:bg-blue-50/40 transition-colors cursor-pointer ${i % 2 !== 0 ? "bg-gray-50/30" : ""}`}>

                      {/* Payment ID */}
                      <td className="px-5 py-3.5 text-xs font-600 text-blue-600 whitespace-nowrap">{p.id}</td>

                      {/* Order ID */}
                      <td className="px-5 py-3.5 text-xs font-500 text-indigo-600 whitespace-nowrap">{p.orderId}</td>

                      {/* Customer */}
                      <td className="px-5 py-3.5">
                        <div className="flex items-center gap-2">
                          <Avatar name={p.customer} size={28} />
                          <span className="text-xs text-gray-700 font-500 whitespace-nowrap">{p.customer}</span>
                        </div>
                      </td>

                      {/* Amount */}
                      <td className="px-5 py-3.5 text-xs font-700 text-gray-800 whitespace-nowrap">{p.amount}</td>

                      {/* Method */}
                      <td className="px-5 py-3.5">
                        <div className="flex items-center gap-1.5">
                          <div className="w-6 h-6 rounded-lg bg-gray-100 flex items-center justify-center shrink-0">
                            <Icon d={METHOD_ICONS[p.method] || icons.payments} size={12} className="text-gray-500" />
                          </div>
                          <span className="text-xs text-gray-600 whitespace-nowrap">{p.method}</span>
                        </div>
                      </td>

                      {/* Status badge */}
                      <td className="px-5 py-3.5">
                        <span className={`inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full font-500 ${PAY_STATUS[p.status]?.badge}`}>
                          <span className={`w-1.5 h-1.5 rounded-full ${PAY_STATUS[p.status]?.dot}`} />
                          {p.status}
                        </span>
                      </td>

                      {/* Date */}
                      <td className="px-5 py-3.5 text-xs text-gray-400 whitespace-nowrap">{p.date}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Table Footer */}
            <div className="px-5 py-3 border-t border-gray-50 flex items-center justify-between flex-wrap gap-2">
              <p className="text-xs text-gray-400">Showing {filtered.length} of {payments.length} payments</p>
              <div className="flex gap-1">
                {[1, 2, 3].map(n => (
                  <button key={n} className={`w-7 h-7 rounded-lg text-xs font-600 transition-colors
                    ${n === 1 ? "bg-blue-600 text-white" : "text-gray-500 hover:bg-gray-100"}`}>{n}</button>
                ))}
              </div>
            </div>
          </div>

          {/* ── Modal ── */}
          {showModal && (
            <AddPaymentModal
              onClose={() => setShowModal(false)}
              onSave={handleAdd}
              nextId={`PAY-${String(payments.length + 3001).slice(-4)}`}
            />
          )}
        </div>
      );
    };

    // ── App Shell ──────────────────────────────────────────────────────────────
    const App = () => {
      const [active, setActive] = useState("dashboard");
      const [collapsed, setCollapsed] = useState(false);

      const pages = {
        dashboard:  <Dashboard />,
        customers:  <Customers />,
        products:   <Products />,
        categories: <Categories />,
        orders:     <Orders />,
        payments:   <Payments />,
      };

      return (
        <div className="min-h-screen bg-[#f0f4ff]">
          <Sidebar active={active} setActive={setActive} collapsed={collapsed} />
          <Navbar collapsed={collapsed} setCollapsed={setCollapsed} active={active} />
          <main className={`pt-16 transition-all duration-300 ${collapsed ? "ml-0" : "ml-60"}`}>
            <div className="p-6 max-w-7xl mx-auto">
              {pages[active]}
            </div>
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
